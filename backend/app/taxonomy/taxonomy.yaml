# Eyewear trend taxonomy: the single source of truth.
# Codes are language-neutral and stored in the database; `fr` is the UI label.
# Synonyms (FR + EN) feed the LLM prompt, keyword normalization and search queries.
# `query` marks the synonym used to build bilingual search / Google Trends keywords.

