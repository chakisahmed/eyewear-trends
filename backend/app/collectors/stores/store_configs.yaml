# Store extraction rules (Phase 2). One entry per retailer, keyed by domain ("www." is ignored).
#
# Precedence for every product field: schema.org/Product JSON-LD first (product page, then listing),
# then the CSS rules below. Selectors are CSS only: XPath is refused when the file is loaded.
# Extraction is deterministic (no LLM). Validated by app/collectors/stores/config.py.

stores:
  # Outika (Tunisia), WooCommerce. Checked 2026-09-27: product pages carry schema.org Product JSON-LD
  # (name, image, offers.price, priceCurrency TND); listing cards show no price, hence product_pages.
  # robots.txt has "Disallow: /*?", so pagination follows /page/N/ links, never ?page=.
  outika-eyewear.tn:
    name: "Outika"
    base_url: "https://www.outika-eyewear.tn"
    lang: fr
    country: TN
    default_currency: TND
    default_brand: "Outika"            # house brand; the JSON-LD has no brand
    delay_s: 1.5
    listing:
      urls: ["/product-category/eyeglasses/", "/product-category/sunglasses/"]
      pagination: { next: "a.next.page-numbers", max_pages: 20 }
      product: "div.product.type-product"
      link: "h2.product-title a"
    product_pages:
      enabled: true                    # price only exists in the product-page JSON-LD
      max_products: 300
    fields:                            # CSS fallbacks; JSON-LD is primary
      name:      { css: "h2.product-title a" }
      image_url: { css: "a.product-content-image img", attr: ["data-src", "src"] }
      price:     { css: ".summary p.price .woocommerce-Price-amount", scope: page }   # empty on variable products today
      currency:  { css: ".woocommerce-Price-currencySymbol", scope: page }
      brand:     { css: "meta[property='product:brand']", attr: content, scope: page }
    flags:
      # The JSON-LD says "InStock" even for sold-out items; the page's stock message is the truth.
      out_of_stock: { css: ".stock.out-of-stock", exists: true, scope: page }
      # Single-colour products have no attribute table: categories carry gender and optical/sun.
      # Pages list a French block ("Homme, Optique") then an English one; the first is kept.
      categories:   { css: ".product_meta .posted_in", regex: 'Categor(?:y|ies)\s*:\s*(.+)', scope: page }
    specs:                             # frame attributes (Gender, Materials, Color) -> flags.raw_specs
      rows: "table.variations tr"
      key: "th.label label"
      value: "td.value select option[selected]"

  # MyKenza (Tunisia), WooCommerce + Yoast, multi-brand (Ray-Ban, Loewe…). Checked 2026-09-27:
  # product JSON-LD has name, brand, image; the price sits in offers.priceSpecification (sale price +
  # ListPrice) and the shape in the description ("Forme : Oeil de Chat – Style : … – Matière du cadre : …").
  # robots.txt has "Disallow: /*?", so pagination follows /page/N/ links. Listing cards carry the stock class.
  mykenza.tn:
    name: "MyKenza"
    base_url: "https://www.mykenza.tn"
    lang: fr
    country: TN
    default_currency: TND
    delay_s: 1.5
    description_specs: true            # "Label : value" pairs in the JSON-LD description -> raw_specs
    listing:
      urls: ["/categorie-produit/lunettes-cadres/lunettes/lunettes-homme/",
             "/categorie-produit/lunettes-cadres/lunettes/lunettes-femme/"]
      pagination: { next: "a.next.page-numbers", max_pages: 20 }   # men ~12 pages, women ~14 (they overlap: ~190 unique); 10 cut both
      product: "li.product.type-product"  # excludes the subcategory tiles (li.product-category)
      link: "a.woocommerce-LoopProduct-link"
    product_pages:
      enabled: true                    # shape, brand and price live in the product-page JSON-LD
      max_products: 300
    fields:                            # CSS fallbacks; JSON-LD is primary
      name:      { css: ".woocommerce-loop-product__title" }   # clean: the link text carries "Spray Offert - 50%"
      price:     { css: ".price" }                              # "<ins>249 DT</ins> <del>499 DT</del>" -> 249
      list_price: { css: ".price del" }                         # the struck-through price -> 499 (discount signal)
      image_url: { css: "img", attr: ["data-src", "data-lazy-src", "src"] }  # src is a data: placeholder
    flags:
      out_of_stock: { css: ".outofstock", exists: true }       # class on the card itself (descendant-or-self)
      categories:   { css: ".woocommerce-loop-product__title", regex: '(?i)(lunettes? de (?:soleil|vue)(?:\s+(?:femme|homme|mixte))?)' }

  # LaMode (Tunisia), PrestaShop, "Cadres optiques": ~183 designer prescription frames (Balenciaga, Gucci,
  # Dior…). Checked 2026-09-27: product JSON-LD has name, brand, price (TND), availability; the shape is
  # in a features block ("Forme Lunette : Cat-Eye", "Genre : Femmes"). That block also lists "VISAGE"
  # (recommended face shapes): the tagger deliberately ignores that label. robots.txt allows ?page=N.
  # No discount signal: the JSON-LD has no list price, and it is never paired with a CSS one.
  lamode.tn:
    name: "LaMode"
    base_url: "https://www.lamode.tn"
    lang: fr
    country: TN
    default_currency: TND
    delay_s: 1.5
    listing:
      urls: ["/36-cadres-optiques"]
      pagination: { next: "a.next", max_pages: 20 }   # 12 per page, ~16 pages
      product: "article.product-miniature"
      link: "h3.product-name a"
    product_pages:
      enabled: true                    # the shape is only on the product page
      max_products: 200
    fields:                            # CSS fallbacks; JSON-LD is primary
      name:      { css: "h3.product-name a" }
      brand:     { css: ".product-manufacturer-title" }
      price:     { css: ".product-price-and-shipping .price" }       # "1 420 DT"
      list_price: { css: ".product-price-and-shipping .regular-price" }
      image_url: { css: ".product-thumbnail img", attr: ["data-full-size-image-url", "src"] }
    flags:
      categories: { css: "h3.product-name a", regex: '(?i)(lunettes? de (?:soleil|vue)(?:\s+(?:femme|homme|mixte))?)' }
    specs:                             # features block -> raw_specs (Forme Lunette, Genre, VISAGE, Magasin…)
      rows: "#product-features-tab .card-body > div.row"
      key: "strong"
      value: "span"

  # Etnia Barcelona (Spain), Shopify, the brand's own catalog: the first creator-brand store, not a Tunisian shelf
  # (country ES keeps it out of the "Marché Tunisien" shares and gaps). Checked 2026-09-29, en-es market, EUR:
  # - listings are server-rendered, 24 cards per page, <link rel=next> (the filter survives in it). Optical ~315,
  #   sun ~369. The /collections/*.json endpoint strips the product list, so the HTML is read;
  # - product pages carry schema.org Product JSON-LD (name, brand, per-variant offers in EUR) and one color swatch
  #   per variant: value = the commercial code (Palier 3), data-option-display-label = the store's color name
  #   (aria-label adds " - Notify me" when that color is sold out). Product .json is never fetched: it has the codes
  #   but not the color names;
  # - model names (KORE, IZZI) carry no shape. Shape, gender and material come from the store's own filters,
  #   listed one value at a time. The shape metafield span is absent from product pages (0 of 9 sampled): unused;
  # - robots.txt forbids sort_by, "+" and two filters in one URL (Python's robotparser does not apply that last
  #   rule, which starts with "*"). Facet passes use one filter per request by construction; tested.
  etniabarcelona.com:
    name: "Etnia Barcelona"
    base_url: "https://etniabarcelona.com"   # the apex: www 301-redirects here
    lang: en
    country: ES
    default_currency: EUR
    default_brand: "Etnia Barcelona"
    delay_s: 1.5
    listing:
      urls:
        - { url: "/collections/optical", categories: "Optique" }
        - { url: "/collections/sun", categories: "Solaire" }
      pagination: { next: "link[rel=next]", max_pages: 20 }   # optical 14 pages, sun 16
      product: "li.product-grid__item"
      link: "a.product-card__link"                            # /collections/optical/products/kore?variant=…
      url_regex: '(/products/[^/?#]+)'                        # -> /products/kore: one product per frame
      facets:                                                 # values and labels read from the listing's filter form
        - { name: "Forme", param: "filter.p.m.custom.shape" }        # CAT-EYE/BUTTERFLY, OVAL, PANTOS, PILOT…
        - { name: "Gender", param: "filter.v.m.custom.gender" }      # Man, Woman, Unisex
        - { name: "Materials", param: "filter.p.m.custom.material" } # Acetate, Metal, Combination
        # Best-sellers: a variant-level filter (Yes / No); only "Yes" is listed (25 of 315 optical, 2 pages).
        # Frame-level flag: which colour sells cannot be read reliably (the filtered card links the default swatch).
        # The product breadcrumb "Bestsellers" is not a signal: frames outside this filter show it too.
        - { name: "Best-seller", param: "filter.v.m.custom.best_seller", only: ["Yes"], flag: is_bestseller }
    product_pages:
      enabled: true                    # prices and color variants live on the product page
      max_products: 800
    fields:                            # CSS fallbacks; JSON-LD is primary
      name:  { css: "a.product-card__link .visually-hidden" }
      price: { css: ".price" }                                # "255,46 €"
    variants:                          # -> flags.variants = [{code: "HV/BL", color: "Havana", in_stock: true}, …]
      rows: "input[type=radio][name^=Color]"                  # sun pages also have LensName-… radios: excluded
      code: { attr: value }
      label: { attr: [data-option-display-label, aria-label], regex: '^(.*?)(?:\s+-\s+Notify me)?$' }
      available: { attr: data-option-available }
      # The swatch names only the main colour ("Havana"); the try-on widget's JSON names every acetate layer
      # ("Havana/Blue", frameId "5 KORE 54O HVBL" = code HV/BL) -> variant.layers, for laminations and Bicolore.
      layers: vto_carousel

  # Morel (France), Shopify, the brand's own catalog (Morel, 1880 and its lines): a creator brand, not a Tunisian
  # shelf. Checked 2026-09-29, /en/ catalog:
  # - listings: 48 product-card per page, <link rel=next>; optical < 8 pages, sunglasses 2+. Filters: gender and
  #   material (frame level), color_name (variant level, 16 bilingual labels: Bleu / Blue, Noir / Black…);
  # - product pages: no JSON-LD Product and NO price shown to shoppers (only in Shopify's analytics metadata, which
  #   is never read for prices: Morel is presence-only). A spec table gives Shape, Front / Temple material, Gender;
  # - colour variants are radios labelled with the code only ("BM02 AGATHE 1"). The colour filter links the matching
  #   variant (?variant=), and Shopify's variant list gives id -> "RP01 AGATHE 1": that is how a code gets its
  #   colour (per_variant + ids). Nothing is decoded from the code itself;
  # - robots.txt: same Shopify rules as Etnia (no sort_by, no "+"); one filter per request.
  morel.com:
    name: "Morel"
    base_url: "https://morel.com"
    lang: en
    country: FR
    default_brand: "Morel"             # no JSON-LD: every frame is the brand's own
    delay_s: 1.5
    listing:
      urls:
        - { url: "/en/collections/optical", categories: "Optique" }
        - { url: "/en/collections/sunglasses", categories: "Solaire" }
      pagination: { next: "link[rel=next]", max_pages: 20 }
      product: "product-card"
      link: "a.product-title"
      url_regex: '(/en)/collections/[^/]+(/products/[^/?#]+)'   # -> /en/products/agathe1
      facets:
        - { name: "Gender", param: "filter.p.m.mymorel.gender" }            # Man, Woman
        - { name: "Materials", param: "filter.p.m.mymorel.material" }       # Acetate, Combined, Stainless steel, Titanium, Wood
        - { name: "Couleur", param: "filter.v.m.mymorel.color_name", per_variant: true }
    product_pages:
      enabled: true                    # the spec table (shape, materials) and the variant codes live there
      max_products: 800
    fields:
      name: { css: "a.product-title" }   # "AGATHE 1"
    specs:
      rows: "div.accordion__content table tr"
      key: "td:first-child strong"
      value: "td:nth-child(2)"
    variants:
      rows: "label[for*='-option1-']"  # "BM02 AGATHE 1"
      code: { regex: '^(\S+)' }        # BM02 (Palier 3); its colour comes from the colour filter pass
      ids: shopify_analytics

  # Barton Perreira (USA, Shopify), scouted 2026-09-29 (docs/scouting/barton-perreira):
  # - two collections of about 116 and 122 products, 54 per page, <link rel="next"> paging;
  # - cards are <product-item> elements linking /products/<slug>;
  # - facets shape and material (variant-level metafields, but the same for every colour), one per request; robots.txt
  #   forbids sort_by, two filter parameters in one URL, and "+" in a path. "Cat Eye" and "Cateye" are two values;
  # - the product page's JSON-LD has one Offer per colourway (name, sku, price, availability): that is the variants
  #   source. The colour name is compound, front / lens / temples / finish: only the front is the frame's colour;
  # - some models are one product per size (norton-46, norton-48): one product per model, the size out of the name;
  # - weight: a filtered page is about 195 KB per product listed, so a crawl downloads roughly 150 MB.
  bartonperreira.com:
    name: "Barton Perreira"
    base_url: "https://bartonperreira.com"
    lang: en
    country: US                        # a brand catalog, not the Tunisian market lens
    default_brand: "Barton Perreira"
    delay_s: 1.5
    name_strip: '\s*\(\d{2}\)$'         # "Banks (48)" -> "Banks"
    listing:
      urls:
        - { url: "/collections/optical-collection", categories: "Optique" }
        - { url: "/collections/sunglass-collection", categories: "Solaire" }
      pagination: { next: "link[rel=next]", max_pages: 20 }
      product: "product-item"
      link: "a[href^='/products/']"
      url_regex: '(/products/[^/?#]+)'  # drops the ?_pos=&_fid=&_ss=&variant= tracking that filtered pages add to card links
      model_regex: '^https://[^/]+/products/(.+?)(?:-\d{2})?$'   # norton-46, norton-48 -> "norton"
      facets:
        - { name: "Shape", param: "filter.v.m.filter.shape" }          # Aviator, Butterfly, Cat Eye, Cateye, Hexagonal, Rectangle, Round, Square
        - { name: "Materials", param: "filter.v.m.filter.material" }   # Acetate, Mixed Materials, Titanium
    product_pages:
      enabled: true                    # JSON-LD: price, and one Offer per colourway
      max_products: 400
    variants:
      json_ld_offers: true
      color_split: { sep: " / ", color: 0 }   # "Absinthe / Clear / Chestnut / Antique Gold": the frame is Absinthe

  # Cubitts (UK, Shopify), scouted 2026-09-30 (docs/scouting/cubitts):
  # - optical /collections/spectacles (6 pages, 117 frames) and sun /collections/sunglasses (7 pages, 132), 20 cards per
  #   page, <link rel="next"> paging (the site's "infinite scroll" loads these same pages);
  # - cards are <product-card> elements with a.product-card__link;
  # - product-level filters, one per request: shape and material. The "Bestsellers" sort is the filter parameter
  #   filter.p.m.custom.sort_by, which robots.txt forbids (`/collections/*sort_by*`): never requested. Instead the plain
  #   collection /collections/bestselling-glasses (16 optical frames) flags is_bestseller (True only: it covers optical only);
  # - product page: JSON-LD Product (name, brand Cubitts, price in GBP); the colourways are the swatch inputs
  #   input[name=Colour], whose value is the store's own colour name. A variant is size / colour / prescription, so sizes
  #   are not separate products;
  # - weight: about 1.3 MB per listing page and 550 KB per product page: roughly 200 MB and 300 requests per crawl.
  cubitts.com:
    name: "Cubitts"
    base_url: "https://cubitts.com"
    lang: en
    country: GB                        # a brand catalog, not the Tunisian market lens
    delay_s: 1.5
    listing:
      urls:
        - { url: "/collections/spectacles", categories: "Optique" }
        - { url: "/collections/sunglasses", categories: "Solaire" }
        - { url: "/collections/bestselling-glasses", flag: is_bestseller }
      pagination: { next: "link[rel=next]", max_pages: 20 }
      product: "product-card"
      link: "a.product-card__link"
      url_regex: '(/products/[^/?#]+)'  # drops the ?_pos=&_fid=&_ss= tracking that filtered pages add to card links
      facets:
        - { name: "Shape", param: "filter.p.m.custom.shape" }          # Square, Round, Oval, Cat-eye, Aviator
        - { name: "Materials", param: "filter.p.m.custom.material" }   # Acetate, Steel, Titanium, Combination
    product_pages:
      enabled: true                    # price (JSON-LD) and the colour swatches live on the product page
      max_products: 400
    variants:
      rows: "input.product-color-swatch__radio[name='Colour']"
      code: { attr: value }            # the store's own colour name is its identity for the colour (Palier 3)
      label: { attr: value }

  # Dita (USA, Shopify), scouted 2026-09-30 (docs/scouting/dita), storefront /en-fr (the France market, priced in EUR for a
  # client without cookies, which is how the crawler asks: Laurhyn is 550 EUR; a browser carrying a Tunisia-market cookie sees /en-tn
  # and USD instead. The prefix is part of every stored URL, so it is fixed from the first crawl):
  # - optical /en-fr/collections/optical (81 frames) and sun /en-fr/collections/sunglasses (91), 3 pages of 40 each,
  #   paging by an <a rel="next"> anchor; cards are <product-item> elements with two anchors;
  # - filters (one per request; robots.txt forbids sort_by and several filter parameters): frame shape and frame
  #   composition. Filtered pages append ?_pos=&_fid=&_ss= tracking to the card links: url_regex cuts it;
  # - the product page's JSON-LD has one Offer per colourway (name, sku, price in EUR on /en-fr, availability). The name is
  #   "frame colour / lens colour" and the frame colour is "Frame - Finish - Finish": only the first token is the frame's colour;
  # - the "best-selling" collections list the whole catalog in sales order, so they cannot flag best-sellers;
  # - weight: about 1.1 MB per listing page and 740 KB per product page: roughly 165 MB and 230 requests per crawl.
  dita.com:
    name: "Dita"
    base_url: "https://dita.com"
    lang: en
    country: US                        # the brand's home market, a catalog and not the Tunisian lens (prices are EUR: the /en-fr market)
    delay_s: 1.5
    listing:
      urls:
        - { url: "/en-fr/collections/optical", categories: "Optique" }
        - { url: "/en-fr/collections/sunglasses", categories: "Solaire" }
      pagination: { next: "a[rel=next]", max_pages: 20 }
      product: "product-item"
      link: "a[href*='/products/']"
      url_regex: '(/en-fr/products/[^/?#]+)'
      facets:
        - { name: "Shape", param: "filter.v.m.vdp.frame_shape" }              # Aviator, Browline, Cat-Eye, Diamond, Navigator, Polyangular, Round, Square (sun: Shield)
        - { name: "Materials", param: "filter.v.m.vdp.frame_composition" }     # Acetate, Titanium, Titanium/Acetate (and the typo Titanuim)
    product_pages:
      enabled: true                    # price (JSON-LD) and the colourways live on the product page
      max_products: 400
    variants:
      json_ld_offers: true
      color_split: { sep: " / ", color: 0, then: { sep: " - ", color: 0 } }   # "Yellow Gold - Black - Shiny Silver / Dark Grey Gradient": the frame is Yellow Gold

  # E.B. Meyrowitz (UK, Shopify), scouted 2026-09-30 (docs/scouting/eb-meyrowitz), colour and price only:
  # - optical /collections/spectacles (65 products, 6 pages of 12) and sun /collections/sunglasses (58, 5 pages),
  #   <link rel="next"> paging, about 320 KB a page. The filters are tag paths (/collections/sunglasses/shape-rectangular,
  #   colour-olive...), not query parameters: not used (the product page gives the shape for every frame);
  # - EACH COLOURWAY IS ITS OWN PRODUCT ("The Grosvenor in Olive"): 123 products, 27 models. A colourway counts as a
  #   frame, like the Tunisian retailers' listings. The page's "Colours:" switcher is not read (it can omit the
  #   current colour and has typos), and the URL handle is not the model key (9 handles disagree with the displayed
  #   name: "The Garrick in Dark Mottle" lives at ...-in-black);
  # - card links are collection-scoped (/collections/spectacles/products/x): url_regex keeps /products/x;
  # - the card says "From £1,250.00"; the page's p.product-showcase__price says £1,250.00 (£1,350.00 for sun);
  # - the colour is in the name (the page's hidden h1, twice), after "in" (written "In" on some): one variant per
  #   product whose code and colour are that name; there is no SKU;
  # - no JSON-LD, material or gender; stock is not readable (no frame is marked sold out);
  # - each product page has a "Finer details" block, four `<p class="products-details__description"><span>Label</span> Value</p>`
  #   lines, the same on every colourway of a model: Build (Rectangular 8 models, Rounded 13, Soft Rectangular 4, Ovular 1,
  #   Teardrop 1) is the frame's SHAPE; Top Line, Bridgework and Rim Structure are kept in raw_specs, not tagged;
  # - weight: about 135 requests and 40 MB, about 4 minutes.
  ebmeyrowitz.com:
    name: "E.B. Meyrowitz"
    base_url: "https://ebmeyrowitz.com"
    lang: en
    country: GB                        # a brand catalog, not the Tunisian market lens
    default_brand: "E.B. Meyrowitz"    # no JSON-LD: every frame is the brand's own
    default_currency: GBP
    delay_s: 1.5
    listing:
      urls:
        - { url: "/collections/spectacles", categories: "Optique" }
        - { url: "/collections/sunglasses", categories: "Solaire" }
      pagination: { next: "link[rel=next]", max_pages: 20 }
      product: "div.product-grid-item"
      link: "h3.product-grid-item__heading a"
      url_regex: '(/products/[^/?#]+)'   # drops the /collections/<name> prefix
    product_pages:
      enabled: true                    # the price and the colour (hidden h1) live on the product page
      max_products: 400
    fields:
      name: { css: "h3.product-grid-item__heading a" }                   # "The Grosvenor in Olive"
      price: { css: "p.product-showcase__price", scope: page }            # "£1,250.00"
    specs:
      rows: "p.products-details__description"   # <span>Build</span> Rectangular
      key: "span"                                # the value is the row's text after the key
    variants:
      rows: "h1"                       # twice on the page, the same name: one variant
      code: { regex: '(?i)\s+in\s+(.+)$' }    # "The Vigo In Amber Mottle" -> "Amber Mottle" (the store's own name is the code)
      label: { regex: '(?i)\s+in\s+(.+)$' }

  # Anne & Valentin (France, custom CMS), scouted 2026-10-01 (docs/scouting/anne-et-valentin):
  # - 16 optical concept hubs (~109 models) and 3 sun concept hubs (~30 models); presence-only (no retail price displayed);
  # - product pages carry clean specs (Dimensions, Matière, Fabrication) and editorial descriptions whose opening words
  #   name the frame's shape ("Octogonale...", "Grande pantos...", "Petite ovale...", "Rectangle moyen...");
  # - variants are inline swatches with reference codes in data-c ("VELISKA_26A40" -> "26A40", Palier 3) and dual acetate hex layers;
  # - robots.txt allows everything; no pagination parameters (each concept page lists its full model line).
  anneetvalentin.com:
    name: "Anne & Valentin"
    base_url: "https://anneetvalentin.com"
    lang: fr
    country: FR                        # French creator brand, catalog tracked for design and material trends
    default_brand: "Anne & Valentin"
    default_currency: EUR
    delay_s: 1.5
    listing:
      urls:
        - { url: "/fr/optique/alpha", categories: "Optique" }
        - { url: "/fr/optique/bakkelite", categories: "Optique" }
        - { url: "/fr/optique/balloon", categories: "Optique" }
        - { url: "/fr/optique/fold", categories: "Optique" }
        - { url: "/fr/optique/formacolor", categories: "Optique" }
        - { url: "/fr/optique/hypercut", categories: "Optique" }
        - { url: "/fr/optique/krafties", categories: "Optique" }
        - { url: "/fr/optique/metro", categories: "Optique" }
        - { url: "/fr/optique/minimalist", categories: "Optique" }
        - { url: "/fr/optique/onthedot", categories: "Optique" }
        - { url: "/fr/optique/pictogram", categories: "Optique" }
        - { url: "/fr/optique/prismatiks", categories: "Optique" }
        - { url: "/fr/optique/punchline", categories: "Optique" }
        - { url: "/fr/optique/puzzle", categories: "Optique" }
        - { url: "/fr/optique/simplecut", categories: "Optique" }
        - { url: "/fr/optique/symboliques", categories: "Optique" }
