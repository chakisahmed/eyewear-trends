# Store extraction rules (Phase 2). One entry per retailer, keyed by domain ("www." is ignored).
#
# Precedence for every product field: schema.org/Product JSON-LD first (product page, then listing),
# then the CSS rules below. Selectors are CSS only: XPath is refused when the file is loaded.
# Extraction is deterministic (no LLM). Validated by app/collectors/stores/config.py.

stores:
  # Outika (Tunisia), WooCommerce. Checked 2026-09-27: product pages carry schema.org Product JSON-LD
  # (name, image, offers.price, priceCurrency TND); listing cards show no price, hence product_pages.
  # robots.txt has "Disallow: /*?", so pagination follows /page/N/ links, never ?page=.
  outika-eyewear.tn:
    name: "Outika"
    base_url: "https://www.outika-eyewear.tn"
    lang: fr
    country: TN
    default_currency: TND
    default_brand: "Outika"            # house brand; the JSON-LD has no brand
    delay_s: 1.5
    listing:
      urls: ["/product-category/eyeglasses/", "/product-category/sunglasses/"]
      pagination: { next: "a.next.page-numbers", max_pages: 20 }
      product: "div.product.type-product"
      link: "h2.product-title a"
    product_pages:
      enabled: true                    # price only exists in the product-page JSON-LD
      max_products: 300
    fields:                            # CSS fallbacks; JSON-LD is primary
      name:      { css: "h2.product-title a" }
      image_url: { css: "a.product-content-image img", attr: ["data-src", "src"] }
      price:     { css: ".summary p.price .woocommerce-Price-amount", scope: page }   # empty on variable products today
      currency:  { css: ".woocommerce-Price-currencySymbol", scope: page }
      brand:     { css: "meta[property='product:brand']", attr: content, scope: page }
    flags:
      # The JSON-LD says "InStock" even for sold-out items; the page's stock message is the truth.
      out_of_stock: { css: ".stock.out-of-stock", exists: true, scope: page }
      # Single-colour products have no attribute table: categories carry gender and optical/sun.
      # Pages list a French block ("Homme, Optique") then an English one; the first is kept.
      categories:   { css: ".product_meta .posted_in", regex: 'Categor(?:y|ies)\s*:\s*(.+)', scope: page }
    specs:                             # frame attributes (Gender, Materials, Color) -> flags.raw_specs
      rows: "table.variations tr"
      key: "th.label label"
      value: "td.value select option[selected]"

