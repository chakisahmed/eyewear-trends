[project]
name = "eyewear-trends"
version = "0.1.0"
description = "AI trend intelligence for an eyewear retailer (backend)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "apscheduler>=3.10,<4",
    "cssselect>=1.2",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "trafilatura>=1.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
trends = ["pytrends>=4.9"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
