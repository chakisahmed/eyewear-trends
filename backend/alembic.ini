# Alembic config. The database URL comes from app settings (DATABASE_URL / .env),
# never from this file, so dev (SQLite) and prod (Postgres) share the same migrations.
#
#   alembic revision --autogenerate -m "describe change"   # after editing app/models.py
#   alembic upgrade head                                   # also done automatically by init_db()

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
